# Zuordnungstabelle der Ersatzschriften (ADR-017): Familie der Vorlage = freie Ersatzfamilie.
# Greift nur, wenn die Familie im Schriftordner des Hosts fehlt. Familien ohne Eintrag bekommen
# die Standardschrift.
Arial = Liberation Sans
Arial\ Narrow = PT Sans Narrow
Times\ New\ Roman = Liberation Serif
Courier\ New = Liberation Mono
*standard* = Liberation Sans
