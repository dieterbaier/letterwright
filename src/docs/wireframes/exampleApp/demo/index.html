<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Klick-Demo – Standardschreiben Beispielanwendung</title>
<style>
  body { margin: 0; background: #2b2f36; font-family: Inter, system-ui, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 10; display: flex; gap: 16px; align-items: center;
         padding: 10px 20px; background: #14181F; color: #c9cdd4; font-size: 13px; }
  .bar b { color: #fff; margin-right: 8px; }
  .bar a { color: #8fe0c0; text-decoration: none; }
  .bar .hint { margin-left: auto; opacity: .7; }
  .stage { display: flex; justify-content: center; padding: 24px 0 48px; }
  .screen { position: relative; width: 1440px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  .screen img { display: block; width: 1440px; }
  .hot { position: absolute; cursor: pointer; border-radius: 8px; }
  .hot.flash { background: rgba(14,124,90,.18); outline: 2px solid rgba(14,124,90,.7); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #14181F; color: #fff;
           padding: 12px 20px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="bar">
  <b>Klick-Demo</b>
  <a href="bestellmaske.html">Bestellmaske (Kunde)</a>
  <a href="#login">Admin-Login</a>
  <span class="hint">Klick ins Leere zeigt die klickbaren Bereiche</span>
</div>
<div class="stage"><div class="screen" id="screen"><img id="img" alt=""></div></div>
<div class="toast" id="toast"></div>
<script>
const go = s => ({ go: s });
const msg = m => ({ msg: m });
const menu = [
  [438, 0, 141, 72, go('bestellungen')],
  [583, 0, 150, 72, go('vorlagen')],
  [1288, 20, 112, 32, go('login')],
];
const screens = {
  danke: { img: 'aoMno', title: 'Vielen Dank', hot: [
    [48, 20, 374, 32, go('bestellmaske')],
    [595, 567, 251, 46, go('bestellmaske')],
    [1300, 0, 92, 72, go('login')],
  ]},
  login: { img: 'PfSJr', title: 'Admin-Login', hot: [
    [560, 563, 320, 46, go('bestellungen')],
    [705, 727, 190, 28, go('bestellmaske')],
  ]},
  bestellungen: { img: 'R0db6a', title: 'Bestellübersicht', hot: [
    ...menu,
    ...[0, 1, 2, 3, 4, 5].map(i => [40, 244 + i * 56, 1360, 56, go('bestellung')]),
  ]},
  bestellung: { img: 'MnfSb', title: 'Bestellbestätigung B-1006', hot: [
    ...menu,
    [280, 104, 192, 16, go('bestellungen')],
    [852, 903, 133, 46, msg('Drucken (Demo)')],
    [997, 903, 163, 46, go('auslieferung')],
  ]},
  auslieferung: { img: 'KCbFK', title: 'Auslieferungsanordnung B-1006', hot: [
    ...menu,
    [280, 104, 192, 16, go('bestellungen')],
    [852, 903, 133, 46, msg('Drucken (Demo)')],
    [997, 903, 163, 46, msg('Bestellung abgeschlossen'), 'bestellungen'],
  ]},
  vorlagen: { img: 'GKqpV', title: 'Vorlagen Standardschreiben', hot: [
    ...menu,
    [1256, 264, 116, 32, msg('Bearbeiten – Bildschirm noch nicht entworfen')],
    [1256, 336, 116, 32, msg('Bearbeiten – Bildschirm noch nicht entworfen')],
  ]},
};
const screenEl = document.getElementById('screen');
const img = document.getElementById('img');
const toastEl = document.getElementById('toast');
let toastTimer;
function toast(t) {
  toastEl.textContent = t; toastEl.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2000);
}
function render() {
  const key = location.hash.slice(1) || 'login';
  if (key === 'bestellmaske') { location.href = 'bestellmaske.html'; return; }
  const s = screens[key] || screens.login;
  document.title = s.title + ' – Klick-Demo';
  img.src = 'screens/' + s.img + '.png';
  screenEl.querySelectorAll('.hot').forEach(h => h.remove());
  for (const [x, y, w, h, action, then] of s.hot) {
    const a = document.createElement('div');
    a.className = 'hot';
    Object.assign(a.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    a.onclick = e => {
      e.stopPropagation();
      if (action.msg) toast(action.msg);
      const target = action.go || then;
      if (target) { location.hash = target; window.scrollTo(0, 0); }
    };
    screenEl.appendChild(a);
  }
}
screenEl.addEventListener('click', () => {
  const hs = screenEl.querySelectorAll('.hot');
  hs.forEach(h => h.classList.add('flash'));
  setTimeout(() => hs.forEach(h => h.classList.remove('flash')), 600);
});
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
