# Zentrale Versionen für das Backend (ADR-009).
[versions]
spring-boot = "4.1.2"
archunit = "1.5.1"
jspecify = "1.0.1"
jacoco = "0.8.16"
jmolecules = "2.0.1"
errorprone = "2.53.0"
nullaway = "0.14.4"
errorprone-plugin = "5.2.0"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter" }
assertj-core = { module = "org.assertj:assertj-core" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
spring-context = { module = "org.springframework:spring-context" }
spring-security-core = { module = "org.springframework.security:spring-security-core" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
jmolecules-ddd = { module = "org.jmolecules:jmolecules-ddd", version.ref = "jmolecules" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }
