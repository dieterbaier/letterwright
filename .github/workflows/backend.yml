name: Backend

# Baut und prüft das Backend mit dem eingecheckten Gradle-Wrapper:
# Kompilieren, Tests, Abdeckungs-Gate (≥ 80 % Zeilen und Zweige je Modul) und ArchUnit.
# Die Matrix mit Java 25 und der Frontend-Teil folgen mit #14.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Gradle-Build (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wrapper-JAR gegen offizielle Prüfsummen validieren
        uses: gradle/actions/wrapper-validation@v5

      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v5

      - name: Bauen und prüfen
        run: ./gradlew build --stacktrace

      - name: Test- und Abdeckungsberichte sichern
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: backend-berichte-java21
          path: |
            src/application/backend/**/build/reports/
            src/application/backend/**/build/test-results/
          if-no-files-found: ignore
